[package]
name = "pcodec-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pco = "=1.0.2"
wasm-bindgen = "0.2.118"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
